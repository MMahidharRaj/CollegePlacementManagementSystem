<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Campus Placements</title><link rel="stylesheet" href="style.css"></head>
<body><main class="main" style="max-width:500px;padding-top:9vh"><div class="panel" style="padding:32px"><div class="brand" style="color:#18243a;padding:0 0 22px">Campus Placements<span style="color:#7e8ba1">Management system</span></div><h1 style="font-size:26px;margin:0">Welcome back</h1><p class="muted" style="margin-bottom:24px">Sign in to manage your placement journey.</p><form id="loginForm" class="form-grid"><label class="field full">Email address<input type="email" required placeholder="you@college.edu"></label><label class="field full">Password<input type="password" required minlength="6" placeholder="Enter your password"></label><button class="primary field full" type="submit">Sign in</button></form><p class="muted" style="text-align:center;margin-top:20px">New to the portal? <a href="register.html">Create an account</a></p><p class="footer-note">Demo interface: sign-in details are not verified. Authentication should be connected to a secure server before real use.</p></div></main><script>document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();location.href='index.html'})</script></body></html>
