<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Campus Placements</title><link rel="stylesheet" href="style.css"></head>
<body><main class="main" style="max-width:580px;padding-top:7vh"><div class="panel" style="padding:32px"><div class="brand" style="color:#18243a;padding:0 0 22px">Campus Placements<span style="color:#7e8ba1">Management system</span></div><h1 style="font-size:26px;margin:0">Create your account</h1><p class="muted" style="margin-bottom:24px">Register as a student to get started.</p><form id="registerForm" class="form-grid"><label class="field">Full name<input required autocomplete="name" placeholder="Your name"></label><label class="field">Student ID<input required placeholder="e.g. CS2026001"></label><label class="field full">College email<input type="email" required autocomplete="email" placeholder="you@college.edu"></label><label class="field">Course<input required placeholder="e.g. Computer Science"></label><label class="field">Graduation year<input type="number" required min="2000" max="2100" placeholder="2026"></label><label class="field full">Password<input type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><button class="primary field full" type="submit">Create account</button></form><p class="muted" style="text-align:center;margin-top:20px">Already registered? <a href="login.html">Sign in</a></p><p class="footer-note">Demo interface: registration is not stored or verified. Connect a secure backend before real use.</p></div></main><script>document.querySelector('#registerForm').addEventListener('submit',e=>{e.preventDefault();location.href='index.html'})</script></body></html>
