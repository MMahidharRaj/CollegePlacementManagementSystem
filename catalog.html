<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Placement Catalogue</title><link rel="stylesheet" href="style.css"></head>
<body><main class="main" style="max-width:1100px"><div class="top"><div><h1>Placement catalogue</h1><p class="muted">Explore current opportunities from campus recruiters.</p></div><a class="primary" href="index.html" style="text-decoration:none">Open dashboard</a></div><div id="catalogue" class="cards"></div></main>
<script>
const box=document.querySelector('#catalogue');let db;try{db=JSON.parse(localStorage.getItem('campusPlacementData'))}catch{};if(!db?.drives?.length){box.innerHTML='<div class="panel" style="grid-column:1/-1"><h2 class="section-title">No drives to show yet</h2><p class="muted">Open the dashboard to add companies and placement drives. Your browser will save them here.</p><a href="index.html">Go to dashboard →</a></div>'}else{box.innerHTML=db.drives.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{const c=db.companies.find(x=>x.id===d.companyId);return `<article class="card"><div class="card-label">${c?.industry||'Campus recruiter'}</div><h2 style="font-size:18px;margin:14px 0 5px">${d.role}</h2><p class="muted">${c?.name||'Company'} · ${new Date(d.date+'T00:00:00').toLocaleDateString()}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px"><strong>${d.package}</strong><span class="pill">Min. CGPA ${d.minCgpa}</span></div></article>`}).join('')}
</script></body></html>
